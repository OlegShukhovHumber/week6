[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cadrates"
version = "0.1.0"
description = "Summarizes CAD exchange rates from the Frankfurter API"
requires-python = ">=3.11"
dependencies = ["requests"]

[tool.setuptools.packages.find]
where = ["src"]
