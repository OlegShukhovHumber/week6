[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cadrates"
version = "0.1.0"
description = "Summarizes CAD exchange rates from the Frankfurter API"
requires-python = ">=3.11"
dependencies = ["requests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cadrates = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
